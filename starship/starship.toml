# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Remove blank line between shell prompts
add_newline = false
command_timeout = 2000
format = '$env_var$directory$git_branch$git_status$nodejs$cmd_duration$line_break$time$character'

[package]
disabled = true

[nodejs]
disabled = false
format = "via [$symbol($version )]($style)"

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[time]
disabled = false

[username]
disabled = true

[hostname]
disabled = true

[container]
disabled = true

[env_var.ONA_WORKSPACE_NAME]
format = '[\[$env_value\]](dimmed white) '
