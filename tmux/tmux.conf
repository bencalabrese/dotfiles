# True color passthrough for Ghostty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc"

set -g mouse off
setw -g mode-keys vi
set -g history-limit 10000
set -sg escape-time 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Status bar — 4 lines: 3 art rows (name inline on middle), windows
set -g status 5
set -g status-position top

set -g status-format[0] "#[bg=colour#{TMUX_COLOR},fg=white,bold]  #{TMUX_ART_0}  #[fill=colour#{TMUX_COLOR}]"
set -g status-format[1] "#[bg=colour#{TMUX_COLOR},fg=white,bold]  #{TMUX_ART_1}  #{?ONA_WORKSPACE_NAME,[#{ONA_WORKSPACE_NAME}],}  #[fill=colour#{TMUX_COLOR}]"
set -g status-format[2] "#[bg=colour#{TMUX_COLOR},fg=white,bold]  #{TMUX_ART_2}  #[fill=colour#{TMUX_COLOR}]"
set -g status-format[3] '#{W:#[bg=colour238]#[fg=colour250] #{window_index}:#{window_name} #[fg=colour238]#{?window_end_flag,#[bg=default],#[bg=colour238]},#{?window_start_flag,,#[fg=colour238]#[bg=colour39]}#[bg=colour39]#[fg=black]#[bold] #{window_index}:#{window_name} #[fg=colour39]#{?window_end_flag,#[bg=default],#[bg=colour238]}}#[default]'
set -g status-format[4] ""

set -g status-style 'bg=default fg=white'
set -g window-status-current-style 'bold'
